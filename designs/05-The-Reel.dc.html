<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
html, body { margin: 0; padding: 0; background: #0C0C0E; overflow-x: hidden; }
* { box-sizing: border-box; }
::selection { background: #E8E6E1; color: #0C0C0E; }
#reel-scroller { scrollbar-width: thin; scrollbar-color: rgba(232,230,225,0.3) transparent; }
#reel-scroller::-webkit-scrollbar { height: 6px; }
#reel-scroller::-webkit-scrollbar-thumb { background: rgba(232,230,225,0.3); border-radius: 3px; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</helmet>

<div data-screen-label="The Reel" style="min-height: 100vh; background: #0C0C0E; color: #E8E6E1; font-family: 'Archivo', system-ui, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; padding: 16px clamp(16px, 4vw, 48px); border-bottom: 1px solid rgba(232, 230, 225, 0.12);">
    <span style="display: inline-flex; align-items: center; gap: 10px;">
      <img src="assets/traits-mark-bright.png" alt="traits by lozeva" style="height: 32px; width: 32px; display: block;">
      <span style="font-family: 'Literata', Georgia, serif; font-size: 16px; opacity: 0.6;">by lozeva</span>
    </span>
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="{{ countSt }}">{{ t.count }}</span>
      <a href="#book" style="padding: 7px 16px; border: 1px solid #4E68F5; border-radius: 100px; font-size: 13px; color: inherit; text-decoration: none;" style-hover="background: #4E68F5; color: #0C0C0E; border-color: #4E68F5;">{{ t.book }}</a>
      <span style="display: inline-flex; gap: 2px;">
        <button onClick="{{ setBg }}" style="{{ bgBtnSt }}">БГ</button>
        <span style="opacity: 0.3;">·</span>
        <button onClick="{{ setEn }}" style="{{ enBtnSt }}">EN</button>
      </span>
    </div>
  </header>

  <section data-screen-label="Film strip" style="position: relative; flex: 1; min-height: 78vh; display: flex; flex-direction: column; justify-content: center; padding: clamp(20px, 3vw, 36px) 0 0;">

    <div style="position: absolute; top: clamp(16px, 3vw, 32px); left: clamp(16px, 4vw, 48px); right: clamp(16px, 4vw, 48px); z-index: 5; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; pointer-events: none;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.45;">{{ t.scrubbing }}</span>
        <span id="{{ yearId }}" style="font-size: clamp(58px, 11vw, 132px); font-weight: 700; line-height: 0.9; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">2016</span>
      </div>
      <span id="{{ capId }}" style="{{ capSt }}"></span>
    </div>

    <div id="{{ scrollerId }}" ref="{{ setScroller }}" style="display: flex; align-items: flex-end; gap: 7px; overflow-x: auto; overflow-y: hidden; padding: clamp(120px, 19vh, 200px) clamp(16px, 4vw, 48px) 18px; cursor: grab; scroll-behavior: auto;">
      <sc-for list="{{ frames }}" as="f" hint-placeholder-count="40">
        <div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px;">
          <div data-i="{{ f.i }}" style="{{ f.st }}" style-hover="filter: brightness(1.4);"></div>
          <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 9.5px; letter-spacing: 0.06em; opacity: 0.4;">{{ f.num }}</span>
        </div>
      </sc-for>
    </div>

    <div style="padding: 0 clamp(16px, 4vw, 48px); margin-top: 8px;">
      <div style="height: 3px; background: rgba(232, 230, 225, 0.14); border-radius: 2px; overflow: hidden;">
        <div id="{{ progId }}" style="height: 100%; width: 0%; background: rgba(232, 230, 225, 0.7);"></div>
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 7px; font-size: 11px; letter-spacing: 0.06em; opacity: 0.4;">
        <span>2016</span>
        <span>{{ t.scrollHint }}</span>
        <span>2026</span>
      </div>
    </div>
  </section>

  <footer style="padding: clamp(28px, 4vw, 52px) clamp(16px, 4vw, 48px) clamp(40px, 5vw, 64px); border-top: 1px solid rgba(232, 230, 225, 0.12);">
    <div style="max-width: 560px;">
      <h2 style="margin: 0 0 16px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5;">{{ t.inqHead }}</h2>
      <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.8; opacity: 0.9; text-wrap: pretty;">{{ t.inq }}</p>
      <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        <a href="#book" style="padding: 11px 20px; border-radius: 100px; background: #4E68F5; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none;" style-hover="opacity: 0.85;">{{ t.book }} →</a>
        <a href="#vouchers" style="padding: 11px 20px; border-radius: 100px; border: 1px solid rgba(232, 230, 225, 0.4); color: inherit; font-size: 14px; text-decoration: none;" style-hover="border-color: #4E68F5; color: #4E68F5;">{{ t.vouchers }} →</a>
        <a href="mailto:hello@traitsbylozeva.com" style="padding: 11px 20px; border-radius: 100px; border: 1px solid rgba(232, 230, 225, 0.4); color: inherit; font-size: 14px; text-decoration: none;" style-hover="border-color: #4E68F5; color: #4E68F5;">{{ t.corp }} →</a>
      </div>
      <p style="margin: 18px 0 0; font-size: 14px; line-height: 1.8; opacity: 0.7;">{{ t.studioCity }} · <a href="mailto:hello@traitsbylozeva.com" style="color: #6E83FF; text-decoration: underline; text-underline-offset: 3px;">hello@traitsbylozeva.com</a></p>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  scrollerId = "reel-scroller";
  yearId = "reel-year";
  capId = "reel-cap";
  progId = "reel-prog";
  state = {
    lang: (typeof localStorage !== "undefined" && localStorage.getItem("lozeva-lang")) || "en",
    sitters: null,
    isMobile: typeof window !== "undefined" && window.matchMedia("(max-width: 640px)").matches
  };

  componentDidMount() {
    if (typeof window !== "undefined") {
      this._mq = window.matchMedia("(max-width: 640px)");
      this._onMq = (e) => this.setState({ isMobile: e.matches });
      this._mq.addEventListener("change", this._onMq);
    }
    import("./sitters.js").then((m) => {
      this.setState({ sitters: m.SITTERS });
    });
    requestAnimationFrame(() => this.resetCap());
  }

  componentWillUnmount() {
    if (this._mq && this._onMq) this._mq.removeEventListener("change", this._onMq);
  }

  componentDidUpdate(prev) {
    if (prev.lang !== this.state.lang) this.resetCap();
  }

  resetCap() {
    const cap = document.getElementById(this.capId);
    if (cap) cap.textContent = this.state.lang === "bg"
      ? "Превъртете встрани, за да минете през десет години. Посочете кадър за името."
      : "Scroll sideways to travel through ten years. Rest on a frame for the name.";
  }

  applyScroller(node) {
    if (this._scrollerNode === node) return;
    if (this._scrollerNode && this._scrollerCleanup) { this._scrollerCleanup(); this._scrollerCleanup = null; }
    this._scrollerNode = node || null;
    if (!node) return;
    const self = this;
    const src = () => self.state.sitters || [];
    const update = () => {
      const yr = document.getElementById(self.yearId);
      const prog = document.getElementById(self.progId);
      const max = node.scrollWidth - node.clientWidth;
      const f = max > 0 ? node.scrollLeft / max : 0;
      const s = src();
      const i = Math.min(s.length - 1, Math.max(0, Math.floor(f * s.length)));
      if (s[i] && yr) yr.textContent = s[i].year;
      if (prog) prog.style.width = (f * 100).toFixed(2) + "%";
    };
    const onWheel = (e) => {
      if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { node.scrollLeft += e.deltaY; e.preventDefault(); }
    };
    let down = false, sx = 0, sl = 0;
    const onDown = (e) => { down = true; sx = e.clientX; sl = node.scrollLeft; node.style.cursor = "grabbing"; try { node.setPointerCapture(e.pointerId); } catch (err) {} };
    const onMove = (e) => { if (!down) return; node.scrollLeft = sl - (e.clientX - sx); };
    const onUp = () => { down = false; node.style.cursor = "grab"; };
    const onOver = (e) => {
      const v = e.target && e.target.getAttribute && e.target.getAttribute("data-i");
      if (v === null || v === "" || v === undefined) return;
      const cap = document.getElementById(self.capId);
      const s = src()[+v];
      if (s && cap) {
        const prov = self.state.lang === "bg" ? s.cBg : s.cEn;
        cap.textContent = (self.state.lang === "bg" ? s.bg : s.en) + " · " + s.year + (prov ? " · " + prov : "");
      }
    };
    node.addEventListener("scroll", update, { passive: true });
    node.addEventListener("wheel", onWheel, { passive: false });
    node.addEventListener("pointerdown", onDown);
    node.addEventListener("pointermove", onMove);
    node.addEventListener("pointerup", onUp);
    node.addEventListener("pointercancel", onUp);
    node.addEventListener("mouseover", onOver);
    this._scrollerCleanup = () => {
      node.removeEventListener("scroll", update);
      node.removeEventListener("wheel", onWheel);
      node.removeEventListener("pointerdown", onDown);
      node.removeEventListener("pointermove", onMove);
      node.removeEventListener("pointerup", onUp);
      node.removeEventListener("pointercancel", onUp);
      node.removeEventListener("mouseover", onOver);
    };
    requestAnimationFrame(update);
  }

  setLang(lang) {
    try { localStorage.setItem("lozeva-lang", lang); } catch (e) {}
    this.setState({ lang });
  }

  buildFrames() {
    if (this._frames && this._framesSrc === this.state.sitters) return this._frames;
    const src = this.state.sitters || [];
    this._frames = src.map((x, i) => {
      const l1 = Math.round(22 + x.t0 * 22), l2 = Math.round(13 + x.t0 * 14);
      return {
        i: String(i),
        num: "№" + String(x.id).padStart(4, "0"),
        st: {
          height: "clamp(300px, 56vh, 560px)",
          aspectRatio: "1",
          flex: "0 0 auto",
          cursor: "inherit",
          background: "url('photos/p" + String((i) % 243 + 1).padStart(3, "0") + ".jpg') center 30% / cover no-repeat, " + "linear-gradient(168deg, hsl(240 3% " + l1 + "%), hsl(240 4% " + l2 + "%))"
        }
      };
    });
    this._framesSrc = this.state.sitters;
    return this._frames;
  }

  renderVals() {
    const lang = this.state.lang;
    const EN = {
      count: "1,412 portraits · 2016–2026",
      scrubbing: "Now passing through",
      scrollHint: "← scroll · drag to travel →",
      bioHead: "About", inqHead: "Sit for a portrait",
      book: "Book a session", vouchers: "Gift vouchers", corp: "Corporate & editorial",
      studioCity: "Studio in Sofia", city: "Sofia",
      inq: "Book a private sitting, give a session as a gift voucher, or commission a corporate or editorial shoot — every frame is added to the same reel.",
      bio: "Lozeva (b. 1971, Sofia) has photographed in black and white for the past ten years. Her portraits — politicians, writers, actors, scientists, and people otherwise unrecorded — are made in available light, on the same terms, with the same patience. Since 2016 she has kept a single continuous archive; it now holds more than fourteen hundred portraits. traits by lozeva is her working studio in Sofia."
    };
    const BG = {
      count: "1 412 портрета · 2016–2026",
      scrubbing: "В момента минавате през",
      scrollHint: "← превъртете · влачете, за да пътувате →",
      bioHead: "За нас", inqHead: "Запазете портрет",
      book: "Запазете час", vouchers: "Подаръчни ваучери", corp: "Корпоративно и редакционно",
      studioCity: "Студио в София", city: "София",
      inq: "Запазете частен сеанс, подарете сесия чрез ваучер или поръчайте корпоративна или редакционна фотосесия — всеки кадър се добавя към същата лента.",
      bio: "Лозева (р. 1971, София) снима черно-бяла фотография през последните десет години. Портретите ѝ — политици, писатели, актьори, учени и хора, останали извън летописа — са правени на естествена светлина, при едни и същи условия, с едно и също търпение. От 2016 г. поддържа един непрекъснат архив; днес той съдържа повече от хиляда и четиристотин портрета. traits by lozeva е нейното работещо студио в София."
    };
    const t = lang === "bg" ? BG : EN;

    if (!this._setBg) {
      this._setBg = () => this.setLang("bg");
      this._setEn = () => this.setLang("en");
      this._setScroller = (node) => this.applyScroller(node);
    }
    const langBtn = (active) => ({
      background: "none", border: "none", padding: "0 3px", font: "inherit",
      fontSize: "12.5px", cursor: "pointer", color: "inherit",
      opacity: active ? 1 : 0.4, fontWeight: active ? 600 : 400
    });

    return {
      t,
      scrollerId: this.scrollerId, yearId: this.yearId, capId: this.capId, progId: this.progId,
      frames: this.buildFrames(),
      setScroller: this._setScroller,
      countSt: { fontSize: "12.5px", letterSpacing: "0.06em", opacity: 0.5, display: this.state.isMobile ? "none" : "inline" },
      capSt: { maxWidth: "46ch", textAlign: "right", fontSize: "13.5px", lineHeight: 1.5, opacity: 0.8, display: this.state.isMobile ? "none" : "inline" },
      setBg: this._setBg, setEn: this._setEn,
      bgBtnSt: langBtn(lang === "bg"), enBtnSt: langBtn(lang === "en")
    };
  }
}

</script>
</body>
</html>
