<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..600;1,7..72,300..500&display=swap">
<style>
html, body { margin: 0; padding: 0; background: #EEEBE4; }
* { box-sizing: border-box; }
::selection { background: #1B1814; color: #EEEBE4; }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</helmet>

<div data-screen-label="The Stream" style="min-height: 100vh; background: #EEEBE4; color: #1B1814; font-family: 'Literata', Georgia, serif; font-variant-numeric: oldstyle-nums;">

  <header style="position: sticky; top: 0; z-index: 90; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; padding: 16px clamp(16px, 4vw, 48px); background: rgba(238, 235, 228, 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid rgba(27, 24, 20, 0.14);">
    <a href="#top" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit;">
      <img src="assets/traits-mark.png" alt="traits by lozeva" style="height: 34px; width: 34px; display: block;">
      <span style="font-family: 'Literata', Georgia, serif; font-size: 16px; opacity: 0.6;">by lozeva</span>
    </a>
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="{{ countSt }}">{{ t.count }}</span>
      <a href="#book" style="padding: 7px 16px; border: 1px solid #0E2FC9; border-radius: 100px; font-size: 13px; color: #0E2FC9; text-decoration: none;" style-hover="background: #0E2FC9; color: #EEEBE4;">{{ t.book }}</a>
      <span style="display: inline-flex; gap: 2px;">
        <button onClick="{{ setBg }}" style="{{ bgBtnSt }}">БГ</button>
        <span style="opacity: 0.3;">·</span>
        <button onClick="{{ setEn }}" style="{{ enBtnSt }}">EN</button>
      </span>
    </div>
  </header>

  <section data-screen-label="River of faces" style="padding: clamp(16px, 3vw, 28px) clamp(10px, 2.6vw, 30px) 0;">
    <div id="{{ gridId }}" onMouseOver="{{ onTile }}" onClick="{{ onTile }}" style="columns: clamp(148px, 14.5vw, 208px); column-gap: 10px;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="60">
        <div data-i="{{ it.i }}" style="{{ it.st }}" style-hover="filter: brightness(1.12); outline: 1px solid rgba(27, 24, 20, 0.55); outline-offset: -1px;"></div>
      </sc-for>
    </div>
  </section>

  <div style="position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; z-index: 80; max-width: 90vw; padding: 8px 18px; background: rgba(238, 235, 228, 0.96); border: 1px solid rgba(27, 24, 20, 0.22); border-radius: 100px; font-size: 13.5px; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 4px 18px rgba(27, 24, 20, 0.1);"><span id="{{ capId }}"></span></div>

  <footer style="margin-top: clamp(48px, 7vw, 96px); padding: clamp(40px, 6vw, 80px) clamp(16px, 4vw, 48px) clamp(56px, 7vw, 96px); border-top: 1px solid rgba(27, 24, 20, 0.16); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: clamp(32px, 5vw, 72px); max-width: 1180px;">
    <div>
      <h2 style="margin: 0 0 18px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5;">{{ t.bioHead }}</h2>
      <p style="margin: 0; max-width: 52ch; font-size: 16px; font-weight: 300; line-height: 1.9; text-wrap: pretty;">{{ t.bio }}</p>
    </div>
    <div>
      <h2 style="margin: 0 0 18px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5;">{{ t.inqHead }}</h2>
      <p style="margin: 0 0 22px; font-size: 15px; font-weight: 300; line-height: 1.8; text-wrap: pretty;">{{ t.inq }}</p>
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 10px;">
        <a href="#book" style="padding: 11px 20px; border-radius: 100px; background: #0E2FC9; color: #EEEBE4; font-size: 14px; text-decoration: none;" style-hover="opacity: 0.85;">{{ t.book }} →</a>
        <a href="#vouchers" style="padding: 11px 20px; border-radius: 100px; border: 1px solid rgba(27, 24, 20, 0.35); color: inherit; font-size: 14px; text-decoration: none;" style-hover="border-color: #0E2FC9; color: #0E2FC9;">{{ t.vouchers }} →</a>
        <a href="mailto:hello@traitsbylozeva.com" style="padding: 11px 20px; border-radius: 100px; border: 1px solid rgba(27, 24, 20, 0.35); color: inherit; font-size: 14px; text-decoration: none;" style-hover="border-color: #0E2FC9; color: #0E2FC9;">{{ t.corp }} →</a>
      </div>
      <p style="margin: 18px 0 0; font-size: 14px; line-height: 1.8; opacity: 0.7;">{{ t.studioCity }} · <a href="mailto:hello@traitsbylozeva.com" style="color: #0E2FC9; text-decoration: underline; text-underline-offset: 3px;">hello@traitsbylozeva.com</a></p>
    </div>
    <div>
      <h2 style="margin: 0 0 18px; font-size: 11.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5;">{{ t.exhHead }}</h2>
      <div>
        <sc-for list="{{ exhibitions }}" as="e" hint-placeholder-count="6">
          <div style="display: grid; grid-template-columns: 50px 1fr; gap: 12px; padding: 6px 0; border-bottom: 1px solid rgba(27, 24, 20, 0.1); font-size: 13.5px; line-height: 1.65;">
            <span style="opacity: 0.5;">{{ e.y }}</span>
            <span>{{ e.t }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  scrollerId = "stream-grid";
  capId = "stream-cap";
  state = {
    lang: (typeof localStorage !== "undefined" && localStorage.getItem("lozeva-lang")) || "en",
    sitters: null,
    isMobile: typeof window !== "undefined" && window.matchMedia("(max-width: 640px)").matches
  };

  componentDidMount() {
    if (typeof window !== "undefined") {
      this._mq = window.matchMedia("(max-width: 640px)");
      this._onMq = (e) => this.setState({ isMobile: e.matches });
      this._mq.addEventListener("change", this._onMq);
    }
    import("./sitters.js").then((m) => {
      this.setState({ sitters: m.SITTERS });
      requestAnimationFrame(() => this.resetCaption());
    });
  }

  componentWillUnmount() {
    if (this._mq && this._onMq) this._mq.removeEventListener("change", this._onMq);
  }

  componentDidUpdate(prev) {
    if (prev.lang !== this.state.lang) this.resetCaption();
  }

  resetCaption() {
    const cap = document.getElementById(this.capId);
    if (cap) cap.textContent = this.state.lang === "bg"
      ? "Посочете лице, за да видите името · 1 412 портрета"
      : "Rest on a face to read the name · 1,412 portraits";
  }


  setLang(lang) {
    try { localStorage.setItem("lozeva-lang", lang); } catch (e) {}
    this.setState({ lang });
  }

  buildItems() {
    if (this._items && this._itemsSrc === this.state.sitters) return this._items;
    const src = this.state.sitters || [];
    this._items = src.map((x, i) => {
      const ar = 0.64 + x.t0 * 0.2;
      const l1 = Math.round(60 + x.t0 * 16), l2 = Math.round(42 + x.t0 * 14);
      return {
        i: String(i),
        st: {
          aspectRatio: String(ar.toFixed(3)),
          breakInside: "avoid",
          marginBottom: "10px",
          cursor: "default",
          background: "linear-gradient(168deg, hsl(34 7% " + l1 + "%), hsl(34 6% " + l2 + "%))"
        }
      };
    });
    this._itemsSrc = this.state.sitters;
    return this._items;
  }

  renderVals() {
    const lang = this.state.lang;
    const EN = {
      count: "1,412 portraits · 2016–2026",
      heroLine: "Every portrait, in one continuous stream.",
      heroSub: "Ten years of sittings, shown without a grid or year markers. Rest on any face to read the name.",
      bioHead: "About", inqHead: "Sit for a portrait", exhHead: "Exhibitions",
      book: "Book a session", vouchers: "Gift vouchers", corp: "Corporate & editorial",
      studioCity: "Studio in Sofia", city: "Sofia",
      inq: "Private sittings by appointment, gift vouchers for someone you love, and corporate or editorial commissions — each one joins the same stream.",
      bio: "Lozeva (b. 1971, Sofia) has photographed in black and white for the past ten years. Her portraits — politicians, writers, actors, scientists, and people otherwise unrecorded — are made in available light, on the same terms, with the same patience. Since 2016 she has kept a single continuous archive; it now holds more than fourteen hundred portraits. traits by lozeva is her working studio in Sofia.",
      exhibitions: [
        { y: "2026", t: "“Faces” — Sofia City Art Gallery (forthcoming)" },
        { y: "2024", t: "“Silence” — Goethe-Institut, Sofia" },
        { y: "2023", t: "Galerie Klein — Berlin" },
        { y: "2021", t: "“The Writers” — National Library, Sofia" },
        { y: "2019", t: "Fotoraum — Vienna" },
        { y: "2017", t: "First solo exhibition — Sofia" }
      ]
    };
    const BG = {
      count: "1 412 портрета · 2016–2026",
      heroLine: "Всеки портрет, в един непрекъснат поток.",
      heroSub: "Десет години сеанси, показани без решетка и без години. Посочете лице, за да видите името.",
      bioHead: "За нас", inqHead: "Запазете портрет", exhHead: "Изложби",
      book: "Запазете час", vouchers: "Подаръчни ваучери", corp: "Корпоративно и редакционно",
      studioCity: "Студио в София", city: "София",
      inq: "Частни сеанси по уговорка, подаръчни ваучери за някого скъп и корпоративни или редакционни поръчки — всяка от тях се влива в същия поток.",
      bio: "Лозева (р. 1971, София) снима черно-бяла фотография през последните десет години. Портретите ѝ — политици, писатели, актьори, учени и хора, останали извън летописа — са правени на естествена светлина, при едни и същи условия, с едно и също търпение. От 2016 г. поддържа един непрекъснат архив; днес той съдържа повече от хиляда и четиристотин портрета. traits by lozeva е нейното работещо студио в София.",
      exhibitions: [
        { y: "2026", t: "„Лица“ — Софийска градска художествена галерия (предстояща)" },
        { y: "2024", t: "„Тишина“ — Гьоте-институт, София" },
        { y: "2023", t: "Galerie Klein — Берлин" },
        { y: "2021", t: "„Писателите“ — Национална библиотека, София" },
        { y: "2019", t: "Fotoraum — Виена" },
        { y: "2017", t: "Първа самостоятелна изложба — София" }
      ]
    };
    const t = lang === "bg" ? BG : EN;

    if (!this._setBg) {
      this._setBg = () => this.setLang("bg");
      this._setEn = () => this.setLang("en");
      this._onTile = (e) => {
        const v = e.target && e.target.getAttribute && e.target.getAttribute("data-i");
        if (v === null || v === "" || v === undefined) return;
        const s = (this.state.sitters || [])[+v];
        const cap = document.getElementById(this.capId);
        if (s && cap) {
          const prov = this.state.lang === "bg" ? s.cBg : s.cEn;
          cap.textContent = (this.state.lang === "bg" ? s.bg : s.en) + " · " + s.year + (prov ? " · " + prov : "");
        }
      };
    }
    const langBtn = (active) => ({
      background: "none", border: "none", padding: "0 3px", font: "inherit",
      fontSize: "12.5px", cursor: "pointer", color: "inherit",
      opacity: active ? 1 : 0.4, fontWeight: active ? 600 : 400
    });

    return {
      t,
      gridId: this.scrollerId,
      capId: this.capId,
      items: this.buildItems(),
      onTile: this._onTile,
      countSt: { fontSize: "12.5px", letterSpacing: "0.05em", opacity: 0.55, display: this.state.isMobile ? "none" : "inline" },
      exhibitions: t.exhibitions,
      setBg: this._setBg, setEn: this._setEn,
      bgBtnSt: langBtn(lang === "bg"), enBtnSt: langBtn(lang === "en")
    };
  }
}

</script>
</body>
</html>
