name: Deploy dry run (FTPS)

# ---------------------------------------------------------------------------
# TEMPORARY — Round 5 dry run only. Delete this file once the real
# deploy-ftp.yml is in place and verified.
#
# This uploads exactly one throwaway file (_dryrun/_deploytest.txt) so we can
# prove three things before any site content is pushed to shared hosting:
#
#   1. the FTPS credentials work at all,
#   2. the scoped FTP user lands in /home/yanaloz/traits.yanalozeva.com,
#   3. yanalozeva.com (Yana's live WordPress, a SIBLING directory) is untouched.
#
# It is manual-dispatch only, on purpose: nothing here fires on push.
#
# SAFETY — do not relax any of these:
#   * dangerous-clean-slate is NEVER set. It wipes the remote directory first.
#   * server-dir stays "./" — the scoped user logs straight into its own root.
#     Never point it at "/" or any parent path.
#   * protocol stays ftps. Plain ftp sends the password in clear text.
#   * do not swap in deploy@yanalozeva.com; that account is scoped to the whole
#     cPanel account, including public_html.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

jobs:
  dry-run:
    name: Upload a single test file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show what will be uploaded
        run: ls -la _dryrun/

      - name: Upload test file over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # Only the _dryrun folder is synced, so this cannot push the site.
          local-dir: ./_dryrun/
          # The FTP user is scoped to the subdomain, so its root IS the docroot.
          server-dir: ./
          # dangerous-clean-slate intentionally omitted (defaults to false).
